server:
  port: ${PORT:8080}
spring:
  application:
    name: subsidy-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
ai:
  ollama:
    url: ${OLLAMA_URL:http://127.0.0.1:11434}
  vision:
    model: ${OLLAMA_MODEL:qwen3-vl:4b-instruct}
